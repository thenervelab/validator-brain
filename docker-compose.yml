services:
  ipfs:
    image: ipfs/kubo:latest
    container_name: ipfs-node
    ports:
      - "4001:4001"
      - "5001:5001"
      - "8080:8080"
    volumes:
      - ipfs_data:/data/ipfs
    environment:
      - IPFS_PROFILE=server
    healthcheck:
      test: ["CMD", "ipfs", "id"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:17
    container_name: postgres-substrate
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-substrate_fetcher}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-substrate_fetcher}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  validator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ipfs-validator
    depends_on:
      ipfs:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - IPFS_NODE_URL=http://ipfs:5001
      - IPFS_GATEWAY_URL=http://ipfs:8080
      - NODE_URL=${NODE_URL:-wss://rpc.hippius.network}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-substrate_fetcher}
      - DATABASE_URL=postgres://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-substrate_fetcher}?sslmode=disable
      - KEYSTORE_PATH=${KEYSTORE_PATH:-/app/keystore}
      - VALIDATOR_ACCOUNT_ID=${VALIDATOR_ACCOUNT_ID:-test_validator}
      - EPOCH_BLOCK_INTERVAL=${EPOCH_BLOCK_INTERVAL:-100}
      - ALWAYS_VALIDATE=1
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - keystore_data:/app/keystore
    restart: unless-stopped

volumes:
  ipfs_data:
    name: ipfs-data
  postgres_data:
    name: postgres-data
  keystore_data:
    name: keystore-data