services:
  ipfs:
    image: ipfs/kubo:latest
    container_name: ipfs-node
    ports:
      - "4001:4001"
      - "5001:5001"
      - "8080:8080"
    volumes:
      - ipfs_data:/data/ipfs
      - ./ipfs-init.sh:/usr/local/bin/ipfs-init.sh:ro
    environment:
      - IPFS_PROFILE=server
    healthcheck:
      test: [ "CMD", "ipfs", "id" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - validator-network
    entrypoint: ["/usr/local/bin/ipfs-init.sh"]

  postgres:
    image: postgres:17
    container_name: postgres-substrate
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-substrate_fetcher}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-substrate_fetcher}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - validator-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-substrate
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-admin}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-admin}
      - RABBITMQ_DEFAULT_VHOST=${RABBITMQ_VHOST:-/}
    ports:
      - "5672:5672"     # AMQP port
      - "15672:15672"   # Management UI port
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - rabbitmq_logs:/var/log/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - validator-network

  dbmate:
    image: ghcr.io/amacneil/dbmate
    container_name: dbmate-migrations
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-substrate_fetcher}?sslmode=disable
      - DBMATE_MIGRATIONS_DIR=/db/migrations
    volumes:
      - ../db/migrations:/db/migrations
    networks:
      - validator-network
    depends_on:
      postgres:
        condition: service_healthy
    command: [ "up" ]
    restart: "no"

volumes:
  ipfs_data:
    name: ipfs-data
  postgres_data:
    name: postgres-data
  rabbitmq_data:
    name: rabbitmq-data
  rabbitmq_logs:
    name: rabbitmq-logs

networks:
  validator-network:
    driver: bridge
    name: validator-network