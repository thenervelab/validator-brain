apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
      - name: postgres
        image: postgres:17
        ports:
        - containerPort: 5432
        envFrom:
        - configMapRef:
            name: ipfs-validator-config
        env:
        - name: POSTGRES_INITDB_ARGS
          value: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
        command:
        - postgres
        - -c
        - max_connections=$(POSTGRES_MAX_CONNECTIONS)
        - -c
        - shared_buffers=$(POSTGRES_SHARED_BUFFERS)
        - -c
        - effective_cache_size=$(POSTGRES_EFFECTIVE_CACHE_SIZE)
        - -c
        - work_mem=$(POSTGRES_WORK_MEM)
        - -c
        - maintenance_work_mem=$(POSTGRES_MAINTENANCE_WORK_MEM)
        - -c
        - checkpoint_completion_target=$(POSTGRES_CHECKPOINT_COMPLETION_TARGET)
        - -c
        - wal_buffers=$(POSTGRES_WAL_BUFFERS)
        - -c
        - max_wal_size=$(POSTGRES_MAX_WAL_SIZE)
        - -c
        - min_wal_size=$(POSTGRES_MIN_WAL_SIZE)
        - -c
        - max_worker_processes=$(POSTGRES_MAX_WORKER_PROCESSES)
        - -c
        - max_parallel_workers=$(POSTGRES_MAX_PARALLEL_WORKERS)
        - -c
        - max_parallel_workers_per_gather=$(POSTGRES_MAX_PARALLEL_WORKERS_PER_GATHER)
        - -c
        - max_parallel_maintenance_workers=$(POSTGRES_MAX_PARALLEL_MAINTENANCE_WORKERS)
        - -c
        - default_statistics_target=100
        - -c
        - random_page_cost=1.1
        - -c
        - effective_io_concurrency=200
        - -c
        - log_min_duration_statement=1000
        - -c
        - log_connections=on
        - -c
        - log_disconnections=on
        - -c
        - log_lock_waits=on
        - -c
        - deadlock_timeout=1s
        - -c
        - lock_timeout=30s
        - -c
        - idle_in_transaction_session_timeout=300s
        securityContext:
          runAsUser: 999
          runAsGroup: 999
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - user
            - -d
            - substrate_fetcher
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - user
            - -d
            - substrate_fetcher
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: ipfs-validator
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
  type: ClusterIP 