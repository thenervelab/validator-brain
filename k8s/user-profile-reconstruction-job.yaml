apiVersion: batch/v1
kind: Job
metadata:
  name: user-profile-reconstruction-processor
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: processor
        image: registry.starkleytech.com/library/ipfs-service-validator
        imagePullPolicy: Always
        command: ["python", "rabbitmq/user_profile_reconstruction_processor.py"]
        envFrom:
        - configMapRef:
            name: ipfs-validator-config
        workingDir: /app
  backoffLimit: 3 