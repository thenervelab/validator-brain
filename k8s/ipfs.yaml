apiVersion: apps/v1
kind: Deployment
metadata:
  name: ipfs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ipfs
  template:
    metadata:
      labels:
        app: ipfs
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
      - name: fix-permissions
        image: busybox:1.35
        command: ['sh', '-c', 'chown -R 1000:1000 /data/ipfs && chmod -R 755 /data/ipfs']
        volumeMounts:
        - name: ipfs-data
          mountPath: /data/ipfs
        securityContext:
          runAsUser: 0
      containers:
      - name: ipfs
        image: ipfs/kubo:latest
        ports:
        - containerPort: 4001
          name: swarm
        - containerPort: 5001
          name: api
        - containerPort: 8080
          name: gateway
        env:
        - name: IPFS_PROFILE
          value: server
        volumeMounts:
        - name: ipfs-data
          mountPath: /data/ipfs
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        livenessProbe:
          exec:
            command:
            - ipfs
            - id
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          exec:
            command:
            - ipfs
            - id
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 10
      volumes:
      - name: ipfs-data
        persistentVolumeClaim:
          claimName: ipfs-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: ipfs-service
spec:
  selector:
    app: ipfs
  ports:
  - port: 4001
    targetPort: 4001
    name: swarm
  - port: 5001
    targetPort: 5001
    name: api
  - port: 8080
    targetPort: 8080
    name: gateway
  type: ClusterIP 