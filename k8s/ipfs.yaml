apiVersion: apps/v1
kind: Deployment
metadata:
  name: ipfs
  labels:
    app: ipfs
spec:
  replicas: 20
  selector:
    matchLabels:
      app: ipfs
  template:
    metadata:
      labels:
        app: ipfs
    spec:
      containers:
      - name: ipfs
        image: ipfs/kubo:v0.35.0
        ports:
        - containerPort: 4001
          name: swarm-tcp
          protocol: TCP
        - containerPort: 4001
          name: swarm-udp
          protocol: UDP
        - containerPort: 5001
          name: api
          protocol: TCP
        - containerPort: 8080
          name: gateway
          protocol: TCP
        env:
        - name: IPFS_PROFILE
          value: "server"
        - name: IPFS_LOGGING
          value: "error"
        - name: IPFS_FD_MAX
          value: "8192"
        - name: IPFS_API
          value: "/ip4/0.0.0.0/tcp/5001"
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "1500m"
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          capabilities:
            add: ["SYS_RESOURCE"]
        livenessProbe:
          httpGet:
            path: /api/v0/version
            port: 5001
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /api/v0/version
            port: 5001
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ipfs-service
  annotations:
    description: "IPFS service for swarm, API, and gateway"
spec:
  selector:
    app: ipfs
  ports:
  - port: 4001
    targetPort: 4001
    name: swarm-tcp
    protocol: TCP
  - port: 4001
    targetPort: 4001
    name: swarm-udp
    protocol: UDP
  - port: 5001
    targetPort: 5001
    name: api
    protocol: TCP
  - port: 8080
    targetPort: 8080
    name: gateway
    protocol: TCP
  type: ClusterIP