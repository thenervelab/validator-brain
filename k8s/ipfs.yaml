apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ipfs
  annotations:
    description: "IPFS nodes with unrestricted cluster API access on port 5001"
spec:
  serviceName: ipfs-service
  replicas: 2
  selector:
    matchLabels:
      app: ipfs
  template:
    metadata:
      labels:
        app: ipfs
        network.policy: "allow-all-cluster"
      annotations:
        network.alpha.kubernetes.io/policy: "allow-all"
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
      - name: fix-permissions
        image: busybox:1.35
        command: ['sh', '-c', 'chown -R 1000:1000 /data/ipfs && chmod -R 755 /data/ipfs']
        volumeMounts:
        - name: ipfs-data
          mountPath: /data/ipfs
        securityContext:
          runAsUser: 0
      containers:
      - name: ipfs
        image: ipfs/kubo:latest
        ports:
        - containerPort: 4001
          name: swarm
          protocol: TCP
        - containerPort: 5001
          name: api
          protocol: TCP
        - containerPort: 8080
          name: gateway
          protocol: TCP
        env:
        - name: IPFS_PROFILE
          value: server
        - name: IPFS_FD_MAX
          value: "8192"
        - name: LIBP2P_RCMGR
          value: "1"
        - name: IPFS_API
          value: "/ip4/0.0.0.0/tcp/5001"
        volumeMounts:
        - name: ipfs-data
          mountPath: /data/ipfs
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          exec:
            command:
            - ipfs
            - id
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          exec:
            command:
            - ipfs
            - id
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 10
  volumeClaimTemplates:
  - metadata:
      name: ipfs-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: ipfs
      resources:
        requests:
          storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ipfs-service
  annotations:
    description: "IPFS service with unrestricted cluster access to port 5001"
    service.alpha.kubernetes.io/tolerate-unready-endpoints: "true"
spec:
  selector:
    app: ipfs
  ports:
  - port: 4001
    targetPort: 4001
    name: swarm
    protocol: TCP
  - port: 5001
    targetPort: 5001
    name: api
    protocol: TCP
  - port: 8080
    targetPort: 8080
    name: gateway
    protocol: TCP
  type: ClusterIP
  publishNotReadyAddresses: true
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ipfs-allow-all-cluster-api
  annotations:
    description: "Allow all cluster traffic to IPFS API port 5001"
spec:
  podSelector:
    matchLabels:
      app: ipfs
  policyTypes:
  - Ingress
  ingress:
  - from: []
    ports:
    - protocol: TCP
      port: 5001
  - from: []
    ports:
    - protocol: TCP
      port: 4001
    - protocol: TCP
      port: 8080 