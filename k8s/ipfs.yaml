apiVersion: apps/v1
kind: Deployment
metadata:
  name: ipfs
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ipfs
  template:
    metadata:
      labels:
        app: ipfs
    spec:
      containers:
      - name: ipfs
        image: ipfs/kubo:latest
        ports:
        - containerPort: 4001
          name: swarm
        - containerPort: 5001
          name: api
        - containerPort: 8080
          name: gateway
        env:
        - name: IPFS_PROFILE
          value: server
        volumeMounts:
        - name: ipfs-data
          mountPath: /data/ipfs
        livenessProbe:
          exec:
            command:
            - ipfs
            - id
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          exec:
            command:
            - ipfs
            - id
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
      - name: ipfs-data
        persistentVolumeClaim:
          claimName: ipfs-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: ipfs-service
spec:
  selector:
    app: ipfs
  ports:
  - port: 4001
    targetPort: 4001
    name: swarm
  - port: 5001
    targetPort: 5001
    name: api
  - port: 8080
    targetPort: 8080
    name: gateway
  type: ClusterIP 