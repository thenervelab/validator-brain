apiVersion: apps/v1
kind: Deployment
metadata:
  name: ipfs
  labels:
    app: ipfs
spec:
  replicas: 1 # Reduced for simplicity in this example; adjust as needed
  selector:
    matchLabels:
      app: ipfs
  template:
    metadata:
      labels:
        app: ipfs
    spec:
      volumes: # Define volumes at the pod level
      - name: ipfs-storage
        emptyDir: {} # Ephemeral storage, lost if pod is deleted. Use PVC for persistence.
      containers:
      - name: ipfs
        image: ipfs/kubo:v0.35.0
        ports:
        - containerPort: 4001
          name: swarm-tcp
          protocol: TCP
        - containerPort: 4001
          name: swarm-udp
          protocol: UDP
        - containerPort: 5001
          name: api
          protocol: TCP
        - containerPort: 8080
          name: gateway
          protocol: TCP
        env:
        - name: IPFS_PROFILE
          value: "server"
        - name: IPFS_LOGGING
          value: "error"
        - name: IPFS_FD_MAX
          value: "8192"
        - name: IPFS_API
          value: "/ip4/0.0.0.0/tcp/5001"
        - name: IPFS_PATH # Important: Tell IPFS where to store its data
          value: "/data/ipfs"
        volumeMounts: # Mount the volume into the container
        - name: ipfs-storage
          mountPath: /data/ipfs
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "1500m"
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          capabilities:
            add: ["SYS_RESOURCE"]
        startupProbe:
          httpGet:
            path: /api/v0/version
            port: 5001 # Ensure this matches your IPFS_API port
          initialDelaySeconds: 10 # How long to wait before the first probe
          periodSeconds: 10       # How often to probe
          failureThreshold: 18    # 18 * 10s = 3 minutes for startup. If it fails 18 times, it's restarted.
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /api/v0/version
            port: 5001
          initialDelaySeconds: 30 # This delay starts *after* startupProbe succeeds or if no startupProbe
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3 # Default, but good to be explicit
        readinessProbe:
          httpGet:
            path: /api/v0/version
            port: 5001
          initialDelaySeconds: 15 # This delay starts *after* startupProbe succeeds or if no startupProbe
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: ipfs-service
  annotations:
    description: "IPFS service for swarm, API, and gateway"
spec:
  selector:
    app: ipfs
  ports:
  - port: 4001
    targetPort: 4001 # Can use name: swarm-tcp here if you prefer
    name: swarm-tcp
    protocol: TCP
  - port: 4001
    targetPort: 4001 # Can use name: swarm-udp
    name: swarm-udp
    protocol: UDP
  - port: 5001
    targetPort: 5001 # Can use name: api
    name: api
    protocol: TCP
  - port: 8080
    targetPort: 8080 # Can use name: gateway
    name: gateway
    protocol: TCP
  type: ClusterIP