apiVersion: apps/v1
kind: Deployment
metadata:
  name: epoch-orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: epoch-orchestrator
  template:
    metadata:
      labels:
        app: epoch-orchestrator
    spec:
      initContainers:
        - name: wait-for-services
          image: busybox:1.35
          command: [ 'sh', '-c', 'until nc -z postgres-service 5432 && nc -z rabbitmq-service 5672; do echo waiting for services; sleep 5; done' ]
      containers:
        - name: orchestrator
          image: registry.starkleytech.com/library/ipfs-service-validator
          imagePullPolicy: Always
          command: [ "python", "epoch_orchestrator.py" ]
          ports:
            - containerPort: 9796
              name: metrics
          envFrom:
            - configMapRef:
                name: ipfs-validator-config
          workingDir: /app
          resources:
            requests:
              memory: "2Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: epoch-orchestrator-service
spec:
  selector:
    app: epoch-orchestrator
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP 