apiVersion: apps/v1
kind: Deployment
metadata:
  name: epoch-orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: epoch-orchestrator
  template:
    metadata:
      labels:
        app: epoch-orchestrator
    spec:
      initContainers:
      - name: wait-for-services
        image: busybox:1.35
        command: ['sh', '-c', 'until nc -z postgres-service 5432 && nc -z rabbitmq-service 5672; do echo waiting for services; sleep 5; done']
      containers:
      - name: orchestrator
        image: ipfs-service-validator:latest
        imagePullPolicy: Never
        command: ["python", "epoch_orchestrator.py"]
        env:
        # Orchestrator configuration
        - name: BLOCK_CHECK_INTERVAL
          value: "6"  # Check every 6 seconds (every block)
        - name: QUEUE_CHECK_TIMEOUT
          value: "300"  # 5 minute timeout for queue processing
        # Validator account (REQUIRED)
        - name: VALIDATOR_ACCOUNT_ID
          value: "5G1Qj93Fy22grpiGKq6BEvqqmS2HVRs3jaEdMhq9absQzs6g"  # Replace with your validator account
        # Validator seed for transaction signing (OPTIONAL but recommended)
        - name: VALIDATOR_SEED
          value: "your_validator_seed_phrase_here"  # Replace with your validator seed phrase
        envFrom:
        - configMapRef:
            name: ipfs-validator-config
        workingDir: /app
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: epoch-orchestrator-service
spec:
  selector:
    app: epoch-orchestrator
  ports:
  - port: 8080
    targetPort: 8080
  type: ClusterIP 