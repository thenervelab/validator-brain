apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-profile-consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-profile-consumer
  template:
    metadata:
      labels:
        app: user-profile-consumer
    spec:
      initContainers:
      - name: wait-for-services
        image: busybox:1.35
        command: ['sh', '-c', 'until nc -z postgres-service 5432 && nc -z rabbitmq-service 5672 && nc -z ipfs-service 5001; do echo waiting for services; sleep 5; done']
      containers:
      - name: consumer
        image: ipfs-service-validator:latest
        imagePullPolicy: Never  # For local development with minikube
        command: ["python", "rabbitmq/user_profile_consumer.py"]
        envFrom:
        - configMapRef:
            name: ipfs-validator-config
        workingDir: /app
---
