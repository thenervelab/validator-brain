name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
    # Checkout code
    - name: Checkout repository
      uses: actions/checkout@v3

    # Get short SHA for tagging
    - name: Get short SHA
      id: sha
      run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    # Set up Docker Buildx
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
      with:
        version: latest
        buildkitd-flags: --debug

    # Login to Custom Registry
    - name: Login to Custom Registry
      uses: docker/login-action@v2
      with:
        registry: registry.starkleytech.com
        username: ${{ secrets.REGISTRY_USERNAME }}
        password: ${{ secrets.REGISTRY_PASSWORD }}
        logout: true

    # Build and push Docker image
    - name: Build and push
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: |
          registry.starkleytech.com/library/ipfs-service-validator:${{ steps.sha.outputs.SHORT_SHA }}
          registry.starkleytech.com/library/ipfs-service-validator:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64
        provenance: false
        sbom: false
        outputs: type=registry,compression=gzip,compression-level=9,force-compression=true
        build-args: |
          NEXT_PUBLIC_BUILD_ID=${{ steps.sha.outputs.SHORT_SHA }}
        # Add layer compression to reduce image size
        labels: |
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.created=${{ github.event.repository.updated_at }}
