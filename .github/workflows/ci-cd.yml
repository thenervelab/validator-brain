name: CI/CD Pipeline

on:
  push:
    branches:
      - dubs

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
    # Checkout code
    - name: Checkout repository
      uses: actions/checkout@v4

    # Get short SHA for tagging
    - name: Get short SHA
      id: sha
      run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    # Set up Docker Buildx with advanced configuration
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        version: latest
        driver-opts: |
          network=host
        buildkitd-flags: |
          --debug
          --allow-insecure-entitlement security.insecure
          --allow-insecure-entitlement network.host

    # Login to Custom Registry
    - name: Login to Custom Registry
      uses: docker/login-action@v3
      with:
        registry: registry.starkleytech.com
        username: ${{ secrets.REGISTRY_USERNAME }}
        password: ${{ secrets.REGISTRY_PASSWORD }}
        logout: true

    # Build and push Docker image with retry logic
    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          registry.starkleytech.com/library/ipfs-service-validator:${{ steps.sha.outputs.SHORT_SHA }}
          registry.starkleytech.com/library/ipfs-service-validator:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64
        provenance: false
        sbom: false
        outputs: |
          type=registry,compression=gzip,compression-level=9,force-compression=true,push-by-digest=true
        build-args: |
          BUILDKIT_INLINE_CACHE=1
        labels: |
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.created=${{ github.event.repository.updated_at }}
        # Optimize for smaller layers
        secrets: |
          GIT_AUTH_TOKEN=${{ github.token }}

    # Fallback: Try Alpine version if main build fails
    - name: Build and push Alpine version (fallback)
      if: failure()
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile.alpine
        push: true
        tags: |
          registry.starkleytech.com/library/ipfs-service-validator:${{ steps.sha.outputs.SHORT_SHA }}-alpine
          registry.starkleytech.com/library/ipfs-service-validator:latest-alpine
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64
        provenance: false
        sbom: false
        outputs: |
          type=registry,compression=gzip,compression-level=9,force-compression=true,push-by-digest=true
