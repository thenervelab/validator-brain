[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["db", "app", "substrate_fetcher"]

[project]
name = "ipfs-service-validator"
version = "0.0.1"
description = "IPFS Service Validator for Substrate-based blockchain network (Bittensor/Hippius Network)"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "dubs", email = "dubs@dubs.rs" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "asyncpg",
    "httpx",
    "aiohttp",
    "python-dotenv",
    "pydantic",
    "pydantic-settings",
    "aiofiles",
    "substrate-interface",
    "websockets",
    "psutil",
    "aio-pika",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "pre-commit",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Enable common rules but ignore complexity and bare except
select = ["E", "F", "W", "I", "N", "UP", "B", "C"]  # Include C rules for completeness
ignore = [
    "C901", # Too complex functions
    "E722", # Bare except clauses
    "E501", # Line too long (let formatter handle this)
]

[tool.ruff.format]
quote-style = "double"
skip-magic-trailing-comma = false
