# Ruff configuration file
line-length = 100

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false  # Preserve trailing commas
line-ending = "auto"

[lint]
# Enable all preview features
preview = true
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "C4",   # flake8-comprehensions
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "COM",  # flake8-commas
    "T20",  # flake8-print
    "PT",   # flake8-pytest-style
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
    "TRY",  # tryceratops
    "ARG",  # flake8-unused-arguments
]

# Force trailing commas in multi-line collections
extend-select = ["COM819"]  # Trailing comma required

ignore = [
    "E501",  # line too long, handled by formatter
    "B008",  # do not perform function calls in argument defaults
]

[lint.isort]
known-third-party = ["fastapi", "uvicorn", "asyncpg", "httpx", "substrateinterface"]

[lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports
"tests/*" = ["E501"]      # line too long